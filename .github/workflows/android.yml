name: Build MasterObrix Android APK

on:
  workflow_dispatch:
  push:
    branches: [ android-beta ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI and Android
        run: npm install @capacitor/cli @capacitor/core @capacitor/android --save

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasterObrix-AI-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
